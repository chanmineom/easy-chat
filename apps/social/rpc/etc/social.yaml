Name: social.rpc
ListenOn: 0.0.0.0:8081
Mode: dev

Auth: true
StrictControl: true

Redis:
  Host: "${REDIS_HOST}"
  Type: node
  Key: "${INTERNAL_AUTH_KEY}"

Mysql:
  DataSource: "${MYSQL_DSN}"

ImRpc:
  Endpoints:
    - "${IM_RPC_ADDR}"
  Timeout: 5000
  App: social.rpc
  Token: "${SOCIAL_RPC_TOKEN}"

Prometheus:
  Host: 0.0.0.0
  Port: 9301
  Path: /metrics

Shutdown:
  WrapUpTime: 2s
  WaitTime: 10s
